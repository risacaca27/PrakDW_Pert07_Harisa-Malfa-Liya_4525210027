<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Kursus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Form Pendaftaran Kursus</h1>
        <p class="subtitle">Silakan isi data diri kamu dengan lengkap.</p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama"
                    placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                    placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Masukkan password" required>
            </div>

            <div class="form-group">
                <label for="nilai">Nilai Akademik</label>
                <input type="number" id="nilai" name="nilai"
                    min="0" max="100" placeholder="0 - 100" required>
            </div>

            <div class="form-group">
                <label for="tanggal">Tanggal Lahir</label>
                <input type="date" id="tanggal" name="tanggal" required>
            </div>

            <div class="form-group">
                <label for="kursus">Pilihan Kursus</label>
                <select id="kursus" name="kursus" required>
                    <option value="">-- Pilih Kursus --</option>
                    <option value="pemrograman">Pemrograman</option>
                    <option value="desain">Desain Grafis</option>
                    <option value="database">Database</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <input type="radio" id="laki" name="gender" value="Laki-laki">
                    <label for="laki">Laki-laki</label>

                    <input type="radio" id="perempuan" name="gender" value="Perempuan">
                    <label for="perempuan">Perempuan</label>
                </div>
            </div>

            <div class="form-group">
                <label for="alasan">Alasan Mengikuti Kursus</label>
                <textarea id="alasan" name="alasan"
                    placeholder="Tuliskan alasan kamu..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit">Daftar</button>
                <button type="reset" class="reset">Reset</button>
                <button type="button" class="info"
                    onclick="alert('Terima kasih telah mengisi formulir!')">
                    Informasi
                </button>
            </div>

        </form>
    </div>

</body>
</html>
